[package]
name = "cellbar"
version = "0.1.0"
edition = "2024"
default-run = "cellbar"
description = "A lightweight, terminal-inspired Wayland status bar engineered for performance, precision, and simplicity"
readme = "README.md"
license = "MIT"
repository = "https://github.com/xavialyra/cellbar"
homepage = "https://github.com/xavialyra/cellbar"
keywords = ["wayland", "status-bar", "layer-shell", "wlroots", "terminal"]
categories = ["command-line-utilities", "gui"]

[features]
dhat-heap = ["dep:dhat"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

[dependencies]
calloop = { version = "0.14.4", features = ["signals"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cursor-icon = "1.2.0"
dhat = { version = "0.3.3", optional = true }
swash = { version = "0.2.10", features = ["std"] }
fontdb = { version = "0.23.0", default-features = false, features = ["std", "fs", "memmap"] }
ttf-parser = "0.25.1"
humantime = "2.4.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = { version = "0.2", default-features = false }
pipewire = "0.10.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
rustix = { version = "1.1.4", features = ["fs", "process", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
thiserror = "2.0.20"
toml = "1.1.4"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
